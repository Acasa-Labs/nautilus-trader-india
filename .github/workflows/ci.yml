name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v

  package:
    # A unit test cannot catch a packaging defect: the source tree has the
    # data files whether or not the wheel does. This job builds the wheel
    # and asserts the YAML tables are inside it -- without them, every
    # lookup raises on an installed copy while passing in the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel
      - name: The data tables must ship inside the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "nautilus_india/core/data/lot_sizes.yaml",
              "nautilus_india/core/data/rates.yaml",
              "nautilus_india/core/data/margin_rates.yaml",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing data tables: {missing}")
          print(f"{wheel}: all {len(required)} data tables present")
          PY
      - name: The wheel imports and answers from its own data
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "
          from datetime import date
          from nautilus_india.core.lots import lot_size
          assert lot_size('NIFTY', date(2026, 6, 30)) == 65
          print('installed wheel reads its lot table')
          "

  secrets:
    # A token in a commit is public the moment it is pushed, and rewriting
    # history does not un-publish it -- the old object stays reachable by SHA
    # until GitHub garbage-collects, which is not a guarantee you control.
    # So this scans every commit rather than the diff: a secret added in one
    # commit and removed in the next still sits in the history anyone can
    # clone, and a diff-only scan reports that history as clean.
    #
    # The pinned binary rather than gitleaks-action, because since v2 that
    # action requires a licence key for organisation-owned repos and this is
    # one. The scanner itself is MIT; only the action changed licence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout defaults to a shallow clone, which would leave this job
          # scanning a single commit while reporting success.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: No secret in any commit
        # --redact because Actions logs on a public repository are public: a
        # job that catches a leak must not be the thing that republishes it.
        run: gitleaks git --no-banner --redact --exit-code 1 .
