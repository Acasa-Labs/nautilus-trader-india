# NIFTY lot sizes, keyed by contract EXPIRY and OBSERVED from NSE's own
# F&O bhavcopy archive -- not taken from secondary reporting.
#
# Method: UDiFF files (2024-01 onward) carry NewBrdLotQty per contract
# directly. Legacy files carry no lot column, so it is derived from the
# futures identity turnover = contracts x lot x price, which is unambiguous
# for futures. 187 distinct expiries were harvested across 80 sample
# days spanning 2015-2031.
#
# WHY A MAP AND NOT ONLY RANGES: lot size attaches to a CONTRACT, not to a
# date range. A long-dated contract listed under an old regime keeps its
# original lot after NSE revises. The archive shows this plainly -- the
# 2026-06-25 expiry carries 25 while 2026-06-30 carries 65. A range table
# alone would silently mis-scale every long-dated position.
#
# Lookup order: exact expiry from "observed", else "regimes", else raise.
# Only "observed" hits count as verified.

