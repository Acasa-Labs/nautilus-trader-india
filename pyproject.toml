[project]
name = "nautilus-trader-india"
version = "0.1.1"
description = "ALPHA. A NautilusTrader adapter for Dhan (NSE, BSE, MCX). Zerodha Kite is planned and not yet started."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Acasa Labs" }]
# `kite` is deliberately absent: the Kite adapter is not started, and a
# keyword is a promise to whoever is searching for one.
keywords = ["nautilus_trader", "trading", "dhan", "nse", "bse", "mcx", "india"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "nautilus_trader>=1.231",
    "pyyaml>=6.0",
    # The adapters own their transport rather than using a vendor SDK, so
    # these are the package's reason for existing -- not an optional extra.
    # `nautilus_india.core` still imports neither, which
    # `tests/test_package.py` asserts on sys.modules.
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Vendor SDKs are for cross-checking payload shapes while writing parsers.
# They are never imported at runtime. See spec section 4.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "kiteconnect>=5.0", "dhanhq>=2.0"]

[project.urls]
Homepage = "https://github.com/Acasa-Labs/nautilus-trader-india"
Issues = "https://github.com/Acasa-Labs/nautilus-trader-india/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautilus_india"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:nautilus_india.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly. Ruff's implicit default set widens between releases, so
# an unpinned config makes lint results depend on which ruff a contributor
# happens to have installed.
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE", "DTZ", "TRY", "C4", "SIM"]
ignore = ["TRY003", "E501"]
