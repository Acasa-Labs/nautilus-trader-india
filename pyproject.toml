[project]
name = "nautilus-trader-india"
version = "0.1.0"
description = "NautilusTrader adapters for Zerodha Kite and Dhan (NSE, BSE, MCX)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Pritesh Kanani" }]
keywords = ["nautilus_trader", "trading", "zerodha", "kite", "dhan", "nse", "bse", "mcx"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "nautilus_trader>=1.231",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Adapters only. `core` never imports these.
adapters = ["httpx>=0.27", "websockets>=13.0", "msgspec>=0.18"]
# Vendor SDKs are for cross-checking payload shapes while writing parsers.
# They are never imported at runtime. See spec section 4.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "kiteconnect>=5.0", "dhanhq>=2.0"]

[project.urls]
Homepage = "https://github.com/priteshkeleven/nautilus-trader-india"
Issues = "https://github.com/priteshkeleven/nautilus-trader-india/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautilus_india"]

[tool.hatch.build.targets.wheel.force-include]
"nautilus_india/core/data" = "nautilus_india/core/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:nautilus_india.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly. Ruff's implicit default set widens between releases, so
# an unpinned config makes lint results depend on which ruff a contributor
# happens to have installed.
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE", "DTZ", "TRY", "C4", "SIM"]
ignore = ["TRY003", "E501"]
